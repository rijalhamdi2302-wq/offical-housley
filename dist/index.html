<body>
  <div id="root"></div>
  <script>
    // Register service worker for PWA installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    // Capture beforeinstallprompt for the Install PWA button
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window._deferredPrompt = e;
    });
    window.addEventListener('appinstalled', () => { deferredPrompt = null; window._deferredPrompt = null; });
  </script>
</body>
